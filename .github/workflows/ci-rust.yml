name: ci-rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build (com todas as features de biblioteca)
        run: cargo build --verbose --features separador,download
      - name: Run tests (com todas as features de biblioteca)
        run: cargo test --verbose --features separador,download
      - name: Run docs
        run: cargo doc --no-deps --lib --features separador,download
      - name: Run publish dry-run
        # Valida o empacotamento com as features de biblioteca; sem elas o
        # `--dry-run` testaria só a configuração mínima, que ninguém consome.
        run: cargo publish --dry-run --allow-dirty --features separador,download
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check formatting
        run: cargo fmt --all --check
