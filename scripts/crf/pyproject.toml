[project]
name = "crf_endereco"
version = "0.1.0"
description = "Anotacao e treino do CRF que segmenta enderecos no enderecobr_rs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "markitdown[docx,pdf,xls,xlsx]>=0.1.8",
    "matplotlib>=3.10.7",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "regex>=2026.9.29",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "scikit-learn>=1.7.2",
    "sklearn-crfsuite>=0.5.0",
    "typer>=0.27.2",
    "geocodebr>=0.2.0",
    "pandas>=2.3.4",
    "pyarrow>=21.0.0",
    "tqdm>=4.67.1",
]

[project.scripts]
crf = "crf_endereco.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "recommended"
# Os dados vem de fora (SQLite, DuckDB, JSON da LLM, sklearn) e chegam como
# `Any` por construcao: abaixo, so as regras que nascem dessa fronteira. O
# resto do modo (imports, comparacoes impossiveis, simbolos) continua ligado.
reportAny = false
reportExplicitAny = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportMissingTypeStubs = false
reportUnannotatedClassAttribute = false
reportImplicitStringConcatenation = false
reportUnusedCallResult = false
reportImplicitOverride = false
reportCallInDefaultInitializer = false
reportPrivateUsage = false
reportPrivateLocalImportUsage = false
# `relatorio.avaliar` importa `carregar_tagger` dentro da funcao de proposito:
# no topo, o ciclo com `crf.py` fecharia.
reportImportCycles = false

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]
